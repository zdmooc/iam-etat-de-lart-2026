name: validate-iam-reference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate reference assets and hygiene
        run: python scripts/validate_reference.py
      - name: Install OPA
        run: |
          curl -L -o /tmp/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /tmp/opa
      - name: Validate Rego policies
        run: /tmp/opa test templates/policy/opa -v
