# Exemple conceptuel (adapter au contrôleur utilisé: External Secrets Operator / CSI, etc.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-db-credentials
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: app-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: app/db
        property: username
    - secretKey: password
      remoteRef:
        key: app/db
        property: password
